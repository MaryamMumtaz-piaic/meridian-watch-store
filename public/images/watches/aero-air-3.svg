<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img">
  <defs>
    
    <linearGradient id="metal-aeroairc" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#e4e2dc"/>
      <stop offset="16%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#e4e2dc"/>
      <stop offset="58%" stop-color="#a7a49b"/>
      <stop offset="80%" stop-color="#e4e2dc"/>
      <stop offset="100%" stop-color="#a7a49b"/>
    </linearGradient>
    <radialGradient id="dial-aeroairc" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </radialGradient>
    <linearGradient id="strap-aeroairc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb8ff"/>
      <stop offset="100%" stop-color="#4a8bcc"/>
    </linearGradient>
    <linearGradient id="glare-aeroairc" x1="0.05" y1="0" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="76%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="84%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette-aeroairc" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="blur-aeroairc" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="bg-aeroairc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#07090f"/>

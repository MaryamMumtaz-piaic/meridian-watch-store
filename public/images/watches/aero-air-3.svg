    </filter>
  </defs>
  <rect width="900" height="1125" fill="url(#bg-aeroairc)"/>
  <g filter="url(#shadow-aeroairc)">
    <!-- side profile: band sweeping in from both edges into a thin case band -->
    <path d="M 40 712.5 Q 250 682.5 330 596.5 L 330 636.5 Q 240 732.5 40 758.5 Z" fill="url(#strap-aeroairc)"/>
    <path d="M 860 712.5 Q 650 682.5 570 596.5 L 570 636.5 Q 660 732.5 860 758.5 Z" fill="url(#strap-aeroairc)"/>
    <rect x="320" y="516.5" width="260" height="92" rx="22" fill="url(#metal-aeroairc)"/>
    <rect x="320" y="516.5" width="260" height="26" rx="12" fill="#0a1424" fill-opacity="0.5"/>
    <rect x="330" y="510.5" width="240" height="14" rx="7" fill="#050608" fill-opacity="0.85"/>
    <rect x="580" y="548.5" width="34" height="28" rx="7" fill="url(#metal-aeroairc)"/>
    <rect x="352" y="578.5" width="196" height="8" rx="4" fill="#000" opacity="0.15"/>
  </g>
  <text x="450" y="1035" fill="#ffffff" fill-opacity="0.4" font-family="Helvetica,Arial,sans-serif" font-size="15" letter-spacing="4" text-anchor="middle">CASE PROFILE</text>
